[project]
name = "vouch-invoice-creator"
version = "0.1.0"
description = "Vouch demo operator tool: build synthetic vendor invoices (PDF/PNG/XLSX/CSV/email body) and email them to the Vouch mail receiver."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "reportlab>=4.2",
    "pillow>=10.4",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=5.0"]

[project.scripts]
invoice-creator = "invoice_creator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

# Same rule set as backend/pyproject.toml so the demo tools follow the repo convention.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501", "S101", "S110", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "RUF059"]
