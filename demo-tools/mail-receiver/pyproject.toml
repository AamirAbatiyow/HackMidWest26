[project]
name = "vouch-mail-receiver"
version = "0.1.0"
description = "Vouch inbound mail receiver: aiosmtpd listener that stores invoices and forwards them to the Vouch backend intake."
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.6",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mail-receiver = "mail_receiver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_receiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

# Same rule set as backend/pyproject.toml so the demo tools follow the repo convention.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501", "S101", "S110", "S311", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B", "RUF059"]
