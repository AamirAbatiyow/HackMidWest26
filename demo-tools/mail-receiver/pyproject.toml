[project]
name = "vouch-mail-receiver"
version = "0.1.0"
description = "Vouch inbound mail receiver: aiosmtpd listener that stores invoices and forwards them to the Vouch backend intake."
requires-python = ">=3.12"
dependencies = [
    "aiosmtpd>=1.4.6",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mail-receiver = "mail_receiver.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_receiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
