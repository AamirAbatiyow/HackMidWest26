[project]
name = "vouch-backend"
version = "0.1.0"
description = "Vouch backend workspace: every payment, vouched for."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["projects/*", "packages/*"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[tool.uv.sources]
vouch = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["archive", "infra", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["projects/vouch/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
