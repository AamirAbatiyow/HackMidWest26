apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hackmw
labels:
  - pairs:
      app.kubernetes.io/part-of: hackmidwest
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - inference.yaml
# Secret `app-secrets` is created from your .env by infra/scripts/deploy_akamai.sh (never committed):
#   kubectl -n <ns> create secret generic app-secrets --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -
