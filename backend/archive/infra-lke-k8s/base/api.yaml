apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1 # keep 1: the LLM rate limiter is per process (60 rpm per team key)
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: hackmw-api # set per project in overlays/<name>
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
# type LoadBalancer -> the Linode CCM provisions a NodeBalancer with a public IP.
apiVersion: v1
kind: Service
metadata:
  name: api
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-default-protocol: http
spec:
  type: LoadBalancer
  selector: { app: api }
  ports:
    - port: 80
      targetPort: 8000
