[project]
name = "vouch"
version = "0.1.0"
description = "Vouch: a payment trust layer for business owners (API, intake, identity checks, Strands graph on Akamai inference)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.50",
    "strands-agents[openai]>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "pytesseract>=0.3.13",
    "reportlab>=4.2",
    "boto3>=1.35",
]

[project.optional-dependencies]
# Pure-Python OCR fallback for hosts without the Tesseract binary (large wheel: onnxruntime).
ocr-rapid = ["rapidocr-onnxruntime>=1.3"]
# Real Cedar engine. When absent the shipped Python mirror of policies/vouch.cedar is used.
cedar = ["cedarpy>=4.0"]

[project.scripts]
vouch-api = "vouch.api.app:main"
vouch-demo = "vouch.demo.cli:main"
vouch-smoke-llm = "vouch.llm.smoke:main"
vouch-redteam = "vouch.demo.redteam:main"
vouch-make-samples = "vouch.demo.samples:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]
