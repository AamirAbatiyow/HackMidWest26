[project]
name = "hm-agents-common"
version = "0.1.0"
description = "Strands Agents helpers: model/agent factory, approval interrupts, policy checks, structured output, tracing, sessions."
requires-python = ">=3.11"
dependencies = ["hm-core", "hm-llm", "hm-storage", "pydantic>=2.7"]

[project.optional-dependencies]
agents = ["strands-agents[openai,otel]>=1.10", "mcp>=1.10"]
a2a = ["strands-agents[a2a]>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hm_agents_common"]
