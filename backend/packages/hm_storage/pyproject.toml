[project]
name = "hm-storage"
version = "0.1.0"
description = "S3-compatible object storage wrapper with local-disk fallback for HackMidWest projects."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hm_storage"]
