[project]
name = "hm-ml-common"
version = "0.1.0"
description = "Training loop, synthetic data, LIME explanations, model registry, metrics."
requires-python = ">=3.11"
dependencies = ["hm-core", "numpy>=1.26", "pydantic>=2.7"]

[project.optional-dependencies]
# Lightweight CPU stack: LIME + scikit-learn baselines. Installed by default via the root `explain` group.
explain = ["lime>=0.2.0.1", "scikit-learn>=1.4"]
# PyTorch (CPU wheels on Linux via the root pytorch-cpu index) + explain stack.
ml = ["torch>=2.3", "lime>=0.2.0.1", "scikit-learn>=1.4"]
# Optional deep-model attributions.
xai = ["captum>=0.7", "shap>=0.45"]
# TensorFlow only if a concept truly needs it (large download; no CUDA libs unless you add [and-cuda]).
tf = ["tensorflow>=2.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hm_ml_common"]
