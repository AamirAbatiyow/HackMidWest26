[project]
name = "hm-settlement"
version = "0.1.0"
description = "Pluggable settlement interface: mock (working), XRPL testnet and USDC-on-Arc testnet (stubs)."
requires-python = ">=3.11"
dependencies = ["hm-core"]

[project.optional-dependencies]
xrpl = ["xrpl-py>=3.0"]
arc = ["web3>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hm_settlement"]
