[project]
name = "hm-api-common"
version = "0.1.0"
description = "FastAPI app factory: CORS from env, health/ready routes, request logging, error handling, API-key auth stub."
requires-python = ">=3.11"
dependencies = ["hm-core", "fastapi>=0.111", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hm_api_common"]
